<body class="bg-surface text-on-surface font-body h-screen w-screen overflow-hidden flex items-center justify-center">
<!-- 
      Canvas focusing entirely on the primary button component.
      All navigation shells are suppressed as per semantic mandate for this specific focused view.
    -->
<main class="w-full h-full flex items-center justify-center bg-surface-container-low relative">
<!-- 
          The button component demonstrating the Glass & Gradient Rule 
          and Editorial Spacing from the design system.
        -->
<button class="group relative inline-flex items-center justify-center px-10 py-5 rounded-xl text-on-primary font-body text-title-lg font-semibold tracking-wide transition-all duration-300 ease-in-out focus:outline-none overflow-hidden hover:-translate-y-1 z-10 btn-gradient" style="box-shadow: 0 8px 24px -4px rgba(20, 27, 44, 0.06), 0 4px 8px -2px rgba(0, 61, 155, 0.2);" type="button">
<!-- Subtle hover overlay -->
<span class="absolute inset-0 w-full h-full bg-white opacity-0 group-hover:opacity-10 transition-opacity duration-300 rounded-xl"></span>
<!-- Focus glow (Ghost Border logic applied to focus state) -->
<span class="absolute inset-0 w-full h-full rounded-xl border-2 border-transparent group-focus:border-primary-fixed-dim transition-colors duration-200"></span>
<span class="relative z-10 flex items-center gap-3">
                Click Me
                <span aria-hidden="true" class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:translate-x-1">
                    arrow_forward
                </span>
</span>
</button>
</main>
<script>
        // Micro-interaction: Add a subtle ripple effect to the button click for the Enterprise feel
        const button = document.querySelector('button');
        
        button.addEventListener('mousedown', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('span');
            ripple.style.position = 'absolute';
            ripple.style.top = `${y}px`;
            ripple.style.left = `${x}px`;
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.width = '0';
            ripple.style.height = '0';
            ripple.style.borderRadius = '50%';
            ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.3)';
            ripple.style.transition = 'width 0.6s ease-out, height 0.6s ease-out, opacity 0.8s ease-out';
            ripple.style.zIndex = '0';
            ripple.style.pointerEvents = 'none';
            
            this.appendChild(ripple);
            
            // Trigger reflow
            void ripple.offsetWidth;
            
            const size = Math.max(rect.width, rect.height) * 2;
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.opacity = '0';
            
            setTimeout(() => {
                ripple.remove();
            }, 800);
        });
    </script>
